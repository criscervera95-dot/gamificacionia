<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Practica los pedidos de la app</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Misma práctica que la del inventario: arriba una instrucción a la vez, en
   medio la pantalla (tableta del POS o celular del cliente) y el botón que
   toca tocar brilla. */
:root{
  --bg:#FCF2EB;--paper:#FFFFFF;--ink:#5A3E3E;--muted:#8A6F6A;--rosa:#E8A0B4;--fram:#BF2959;--menta:#7EB7C3;
  --caramelo:#F3D0AE;--line:rgba(90,62,62,.14);--soft:rgba(243,208,174,.38);--side:#5A3E3E;--sidetx:rgba(243,208,174,.75);
  --ok:#2e7d32;--okbg:rgba(46,125,50,.1);
  --display:"Fredoka","Nunito",system-ui,sans-serif;--body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#231A1A;--paper:#2F2424;--ink:#F6E6DC;--muted:#C9AFA6;--rosa:#E8A0B4;--fram:#F06C95;--menta:#8CC6D2;--caramelo:#6B4E3A;
  --line:rgba(246,230,220,.16);--soft:rgba(243,208,174,.12);--side:#160F0F;--sidetx:rgba(243,208,174,.7);--ok:#7BCB80;--okbg:rgba(123,203,128,.12);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#231A1A;--paper:#2F2424;--ink:#F6E6DC;--muted:#C9AFA6;--rosa:#E8A0B4;--fram:#F06C95;--menta:#8CC6D2;--caramelo:#6B4E3A;
  --line:rgba(246,230,220,.16);--soft:rgba(243,208,174,.12);--side:#160F0F;--sidetx:rgba(243,208,174,.7);--ok:#7BCB80;--okbg:rgba(123,203,128,.12);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;margin:0}
.wrap{max-width:900px;margin:0 auto;padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(1.8rem,5vw,2.5rem)}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--menta);outline-offset:2px}
.sub{color:var(--muted);max-width:60ch}
a{color:var(--fram);font-weight:700}

/* Menú de lecciones */
.lecciones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.lec{display:flex;align-items:center;gap:14px;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;min-height:86px}
.lec:hover{border-color:var(--rosa)}
.lec .n{font-family:var(--display);font-size:2rem;line-height:1;flex-shrink:0;width:48px;text-align:center}
.lec b{display:block;font-family:var(--display);font-weight:600;font-size:1.15rem}
.lec small{color:var(--muted);font-size:.88rem}
.lec .chk{margin-left:auto;font-size:1.5rem;color:var(--ok);flex-shrink:0}
.barra-prog{display:flex;align-items:center;gap:10px;font-weight:700}
.barra-prog .pista{flex:1;height:12px;background:var(--soft);border-radius:999px;overflow:hidden}
.barra-prog .lleno{height:100%;background:var(--fram);border-radius:999px;transition:width .4s}
.camino{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:12px 14px;font-weight:800}
.camino span{background:var(--soft);border-radius:999px;padding:6px 12px}
.camino i{font-style:normal;color:var(--muted)}

/* Práctica */
.instr{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border:3px solid var(--fram);border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.instr .num{font-family:var(--display);background:var(--fram);color:#fff;border-radius:12px;padding:4px 10px;font-weight:600;flex-shrink:0}
.instr p{margin:0;font-size:1.2rem;font-weight:700;flex:1;min-width:0}
.instr .oir{flex-shrink:0;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 10px;font-weight:800;cursor:pointer}
.msg{min-height:1.6em;font-weight:800;text-align:center;font-size:1.05rem}
.msg.mal{color:var(--fram)}.msg.bien{color:var(--ok)}
.controles{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ctl{border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:10px 16px;font-weight:800;cursor:pointer;font-size:1rem}
.ctl.prim{background:var(--fram);border-color:var(--fram);color:#fff}

/* Tableta de práctica (imita el POS) */
.tablet{background:var(--side);border-radius:26px;padding:10px;box-shadow:0 14px 40px rgba(0,0,0,.18)}
.pos{display:flex;background:var(--bg);border-radius:18px;overflow:hidden;min-height:470px;position:relative}
.lado{background:var(--side);display:flex;flex-direction:column;gap:6px;padding:8px 6px;flex-shrink:0}
.sb{width:62px;border:none;background:none;color:var(--sidetx);border-radius:12px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.03em;cursor:pointer}
.sb .ic{font-size:1.3rem}
.sb.on{background:var(--fram);color:#fff}
.area{flex:1;min-width:0;padding:12px;display:flex;flex-direction:column;gap:10px}
.tope{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tope .logo{font-family:var(--display);font-weight:600}
.hb{border:none;border-radius:10px;padding:8px 12px;font-weight:800;font-size:.85rem;cursor:pointer;background:#5A3E3E;color:#fff;display:inline-flex;align-items:center;gap:6px}
.hb.naranja{background:#b85c00}
.hb.hay{animation:latido 1.2s ease-in-out infinite}
@keyframes latido{50%{transform:scale(1.06)}}
.badge{background:var(--fram);color:#fff;border-radius:9px;min-width:20px;padding:0 6px;font-size:.75rem;text-align:center}
.hb.naranja .badge{background:#fff;color:#b85c00}
.venta{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:10px;flex:1}
.izq{display:flex;flex-direction:column;gap:8px;min-width:0}
.buscar{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--muted);font-weight:600}
.prods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prods button{background:var(--paper);border:1px solid var(--line);border-radius:12px;height:64px;font-weight:700;font-size:.85rem;color:var(--muted);cursor:pointer}
.mesabar{display:flex;align-items:center;gap:8px;background:var(--paper);border:2px solid var(--menta);border-radius:12px;padding:10px 12px;font-weight:800;cursor:pointer;text-align:left}
.mesabar small{margin-left:auto;color:var(--muted)}
.orden{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.orden .vacio{color:var(--muted);margin:0;font-size:.85rem}
.tag{background:rgba(191,41,89,.1);color:var(--fram);border-radius:10px;padding:6px 8px;font-weight:800;font-size:.8rem}
.lin{display:flex;justify-content:space-between;gap:8px}
.lin.tot{border-top:1px dashed var(--line);padding-top:6px;font-size:1rem}
.nota{color:var(--muted);font-size:.8rem}
.pagos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.pago{border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 2px;font-weight:800;font-size:.72rem;cursor:pointer}
.pago.on{border-color:var(--fram);background:rgba(191,41,89,.1)}
.btn{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}
.btn.prim{background:var(--fram);border-color:var(--fram);color:#fff}
.btn.ancho{width:100%;padding:14px}
.campo{display:flex;flex-direction:column;gap:4px}
.campo label{font-size:.8rem;font-weight:800}
.caja{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:800;font-variant-numeric:tabular-nums;min-height:42px;text-align:left;cursor:pointer;width:100%}
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.teclado button{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:8px;font-size:1.1rem;font-weight:800;cursor:pointer}

/* Ventanas del POS encima de la tableta */
.velo{position:absolute;inset:0;background:rgba(30,20,20,.45);display:flex;align-items:flex-start;justify-content:center;padding:14px;overflow:auto;z-index:3}
.modal{background:var(--paper);border-radius:16px;padding:14px;width:100%;max-width:470px;display:flex;flex-direction:column;gap:10px;box-shadow:0 16px 40px rgba(0,0,0,.25)}
.modal .sec{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.modal p{margin:0;white-space:pre-line}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bi{border:1px solid var(--rosa);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.bi-tit{font-weight:800;font-size:.92rem}
.bi-sub{font-size:.78rem;color:var(--muted)}
.bi-prods{font-size:.85rem}
.bi-acc{display:flex;flex-wrap:wrap;gap:6px}
.est{display:inline-block;border-radius:6px;padding:1px 6px;font-size:.66rem;font-weight:800;margin-left:4px;vertical-align:middle}
.est.nuevo{background:#fdecc8;color:#8a5a00}.est.ok{background:var(--okbg);color:var(--ok)}
.ba{border:2px solid transparent;border-radius:10px;padding:8px 12px;font-weight:800;font-size:.82rem;cursor:pointer;background:var(--rosa);color:#fff}
.ba.wa{background:#25D366}.ba.verde{background:#2E7D4F}.ba.cafe{background:#5A3E3E;border-color:rgba(255,255,255,.15)}
.ba.rojo{background:none;border-color:#c0392b;color:#c0392b}
.ba.orig{outline:3px solid var(--menta)}
.mesas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mesa{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:14px 6px;font-weight:800;cursor:pointer}
.mesa.ocup{border-color:var(--menta)}
.alarma{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:min(380px,calc(100% - 20px));background:#BF2959;color:#fff;border-radius:16px;padding:14px;text-align:center;z-index:4;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.alarma b{display:block;font-size:1.1rem}
.alarma small{opacity:.9}
.alarma .acc{display:flex;gap:8px;justify-content:center;margin-top:10px}
.alarma button{border:none;border-radius:999px;padding:9px 16px;font-weight:800;cursor:pointer}
.alarma .ver{background:#fff;color:#BF2959}
.alarma .sil{background:rgba(255,255,255,.2);color:#fff}
.sonido{position:absolute;top:-6px;right:6px;font-size:1.4rem;animation:mano 1s ease-in-out infinite}

/* WhatsApp (dentro de la tableta) */
.wa-app{background:#ECE5DD;border-radius:18px;overflow:hidden;min-height:470px;display:flex;flex-direction:column;color:#222}
.wa-cab{background:#075E54;color:#fff;display:flex;align-items:center;gap:10px;padding:10px 12px;font-weight:700}
.wa-av{width:34px;height:34px;border-radius:50%;background:#dfe5e7;color:#075E54;display:grid;place-items:center;font-weight:800}
.wa-volver{border:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.15);color:#fff;border-radius:10px;padding:6px 10px;font-weight:800;cursor:pointer}
.wa-chat{flex:1;padding:12px;display:flex;flex-direction:column;gap:8px}
.burb{max-width:85%;border-radius:12px;padding:8px 10px;font-size:.86rem;line-height:1.4;box-shadow:0 1px 1px rgba(0,0,0,.12)}
.burb.yo{align-self:flex-end;background:#DCF8C6}
.burb.el{align-self:flex-start;background:#fff}
.burb .hr{display:block;text-align:right;font-size:.68rem;color:#667}
.wa-pie{display:flex;gap:8px;padding:8px;align-items:flex-end}
.wa-input{flex:1;background:#fff;border-radius:18px;padding:8px 12px;font-size:.82rem;max-height:190px;overflow:auto;color:#333}
.wa-send{width:48px;height:48px;border-radius:50%;border:none;background:#25D366;color:#fff;font-size:1.3rem;cursor:pointer;flex-shrink:0}

/* Celular con la app DulceFriends (colores fijos: así se ve la app real) */
.escena{display:flex;justify-content:center}
.cel{width:min(340px,100%);background:#2b2222;border-radius:36px;padding:10px;box-shadow:0 14px 40px rgba(0,0,0,.2)}
.app{border-radius:28px;min-height:540px;background:linear-gradient(165deg,#FFE3EC 0%,#FFF4E6 60%,#E6F4F6 100%);color:#5A3E3E;padding:16px 14px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.a-cab{display:flex;justify-content:space-between;align-items:baseline}
.a-cab b{font-family:var(--display);font-size:1.3rem}
.a-cab small{color:#8A6F6A;font-weight:700}
.a-buscar{background:#fff;border-radius:14px;padding:9px 12px;color:#8A6F6A;font-weight:600;font-size:.9rem}
.a-prods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.a-prod{background:#fff;border:2px solid transparent;border-radius:18px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;cursor:pointer;color:#5A3E3E}
.a-prod .e{font-size:2rem}
.a-prod small{color:#BF2959;font-weight:800}
.a-barra{margin-top:auto;border:none;border-radius:16px;background:linear-gradient(135deg,#E8A0B4,#BF2959);color:#fff;font-weight:800;padding:14px;display:flex;justify-content:space-between;cursor:pointer;font-size:.95rem}
.a-hoja{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:18px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 -10px 30px rgba(0,0,0,.18)}
.a-velo{position:absolute;inset:0;background:rgba(0,0,0,.3)}
.a-hoja h4{font-size:1.25rem}
.a-hoja p{margin:0;color:#8A6F6A;font-size:.9rem}
.a-agregar{border:none;border-radius:14px;padding:14px;background:linear-gradient(135deg,#E8A0B4,#BF2959);color:#fff;font-weight:800;font-size:.95rem;cursor:pointer}
.a-card{background:#fff;border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px}
.a-card h5{margin:0;font-size:.95rem}
.a-ops{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px}
.a-chip{border:2px solid #F3D0AE;background:#fff;border-radius:12px;padding:9px 6px;font-weight:800;font-size:.82rem;cursor:pointer;color:#5A3E3E}
.a-chip.on{border-color:#BF2959;background:#FFE3EC}
.a-ayuda{font-size:.78rem;color:#8A6F6A;margin:0}
.ped-cab{display:flex;justify-content:space-between;font-size:.78rem;color:#8A6F6A;font-weight:700}
.ep{text-align:center;padding:8px 0}
.ep .e{font-size:2.6rem}
.ep b{display:block;font-family:var(--display);font-size:1.2rem;font-weight:600}
.ep p{margin:4px 0 0;color:#8A6F6A;font-size:.88rem}
.pasos-est{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.pasos-est span{font-size:.7rem;font-weight:800;border-radius:999px;padding:4px 8px;background:#f2e8e2;color:#a08c86}
.pasos-est span.hecho{background:#BF2959;color:#fff}

/* Final de cada lección: lo que pasó + lo que ve el cliente */
.final{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:16px;align-items:center}
.exito{background:var(--paper);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:22px}
.exito .grande{font-size:3.2rem;line-height:1}
.lado-cel{display:flex;flex-direction:column;gap:8px;align-items:center}
.lado-cel .et{font-weight:800;color:var(--muted);font-size:.9rem}
.lado-cel .app{min-height:0}

/* Lo que hay que tocar */
.brilla{position:relative;z-index:2;animation:pulso 1.3s ease-in-out infinite;border-color:var(--fram)!important}
.brilla::after{content:"👆";position:absolute;right:-6px;bottom:-22px;font-size:1.7rem;animation:mano 1.3s ease-in-out infinite;pointer-events:none}
@keyframes pulso{0%,100%{box-shadow:0 0 0 0 rgba(191,41,89,.55)}50%{box-shadow:0 0 0 9px rgba(191,41,89,0)}}
@keyframes mano{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.sacude{animation:sacude .35s}
@keyframes sacude{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.brilla,.brilla::after,.sacude,.hb.hay,.sonido{animation:none}.brilla{box-shadow:0 0 0 4px rgba(191,41,89,.5)}}
@media (max-width:700px){.venta{grid-template-columns:1fr}.final{grid-template-columns:1fr}}
@media (max-width:640px){.lecciones{grid-template-columns:1fr}.sb{width:46px;font-size:.5rem}.prods{grid-template-columns:repeat(2,1fr)}.instr{flex-wrap:wrap}.instr p{font-size:1.05rem;flex-basis:calc(100% - 60px)}.instr .oir{margin-left:auto}.area{padding:8px}.pos{min-height:640px}}
</style>
</head>
<body>

<div class="wrap">
  <div id="app"></div>
  <p class="sub" style="font-size:.85rem">Esta práctica no cambia nada en el POS real ni manda mensajes. Los nombres y teléfonos son de ejemplo. ¿Buscas la del inventario? <a href="../tutorial-inventario/">Practica el inventario</a>.</p>
</div>

<script>
/* ── Pedidos de ejemplo (ficticios) ── */
var PED={
  laura:{nombre:'Laura Pérez',corto:'Laura',tel:'999 555 0101',cod:'A7K2Q',hora:'4:35 p. m.',dom:false,metodo:'Efectivo',total:75,
    lineas:[['1x Frappé Oreo',75]],resp:'¡Sí, gracias! Paso en 20 minutos 😊'},
  jorge:{nombre:'Jorge Ruiz',corto:'Jorge',tel:'999 555 0202',cod:'Q3M8T',hora:'5:10 p. m.',dom:true,metodo:'Efectivo',total:140,envio:30,zona:'Centro',dir:'Calle 60 #123, Centro (casa azul)',
    lineas:[['1x Sundae de fresa',55],['1x Malteada de chocolate',55]],resp:'📍 Ubicación compartida<br>Sí, aquí lo espero 👍'}
};
function pesos(n){return '$'+Number(n).toFixed(2)}

/* ── Tableta del POS ── */
function marco(sel,contenido,o){
  o=o||{};
  var it=[['venta','🛒','Venta'],['ordenes','🧾','Órdenes'],['caja','💰','Caja'],['corte','📊','Corte']];
  var tope='<div class="tope"><span class="logo">🍦 Dulce Ruta</span><span style="flex:1"></span>'+
    (o.porCobrar?'<button class="hb naranja hay" data-t="porcobrar">🛵 Por cobrar <span class="badge">'+o.porCobrar+'</span></button>':'')+
    (o.badge?'<button class="hb hay" data-t="bandeja">📥 Bandeja <span class="badge">'+o.badge+'</span></button>':'')+'</div>';
  return '<div class="tablet"><div class="pos"><nav class="lado">'+it.map(function(x){return '<button class="sb'+(x[0]===sel?' on':'')+'" data-t="sb-'+x[0]+'"><span class="ic">'+x[1]+'</span>'+x[2]+'</button>'}).join('')+'</nav><div class="area">'+tope+contenido+'</div>'+
    (o.alarma?alarma(o.alarma):'')+(o.velo?'<div class="velo">'+o.velo+'</div>':'')+'</div></div>';
}
function alarma(k){
  return '<div class="alarma"><span class="sonido" aria-hidden="true">🔔</span><b>📲 ¡Nuevo pedido!</b><small>De la app DulceFriends · revisa la Bandeja</small><div class="acc"><button class="ver" data-t="ver-alarma">📥 Ver pedido</button><button class="sil" data-t="silenciar">🔕 Silenciar</button></div></div>';
}
function teclado(){return '<div class="teclado">'+[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(function(d){return d===''?'<span></span>':'<button data-t="k-'+d+'">'+d+'</button>'}).join('')+'</div>'}
function panelOrden(s){
  if(!s.carga)return '<div class="orden"><b>Orden</b><p class="vacio">Aquí aparece lo que vas a cobrar.</p></div>';
  var P=PED[s.carga.ped];
  var h=s.carga.mesa?'<div class="tag">🍽️ 📲 '+P.corto+' #'+P.cod+'</div>':'<div class="tag">📲 App #'+P.cod+' · '+P.nombre+'</div>';
  h+=P.lineas.map(function(l){return '<div class="lin"><span>'+l[0]+'</span><b>'+pesos(l[1])+'</b></div>'}).join('');

/* Voz: primero la grabación voz/<clave>.wav (voz Sabina es-MX); si no hay,
   la voz del sistema. La clave es djb2 del texto sin «»: al cambiar un texto
   hay que volver a grabarlo. */
var vozAudio=null;
function claveVoz(t){var x=5381;for(var i=0;i<t.length;i++)x=(((x<<5)+x)+t.charCodeAt(i))>>>0;return x.toString(36)}
function hablar(t){
  t=String(t).replace(/[«»]/g,'').replace(/\s+/g,' ').trim();
  try{if(vozAudio){vozAudio.pause();vozAudio=null}if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}
  var usado=false;function sistema(){if(usado)return;usado=true;hablarSistema(t)}
  try{
    var a=new Audio('voz/'+claveVoz(t)+'.wav');vozAudio=a;
    a.onerror=sistema;
    var p=a.play();if(p&&p.catch)p.catch(function(e){if(e&&e.name==='NotAllowedError')return;sistema()});
  }catch(e){sistema()}
}
function vozEspanol(){
  if(!window.speechSynthesis)return null;
  var v=speechSynthesis.getVoices()||[];
  return v.filter(function(x){return /^es[-_]MX/i.test(x.lang)})[0]||v.filter(function(x){return /^es/i.test(x.lang)})[0]||null;
}
if(window.speechSynthesis&&speechSynthesis.addEventListener)speechSynthesis.addEventListener('voiceschanged',vozEspanol);
function hablarSistema(t){
  try{
    if(!window.speechSynthesis)return;
    speechSynthesis.cancel();
    setTimeout(function(){
      var u=new SpeechSynthesisUtterance(t);u.lang='es-MX';u.rate=.95;
      var v=vozEspanol();if(v)u.voice=v;
      speechSynthesis.resume();speechSynthesis.speak(u);
    },120);
  }catch(e){}
}
function menu(){
  L=null;var n=LECCIONES.filter(function(x){return hechos[x.id]}).length;
  app.innerHTML='<header style="display:flex;flex-direction:column;gap:8px"><div style="font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--fram)">POS Dulce Ruta · práctica</div><h1>Practica los pedidos de la app</h1>'+
   '<p class="sub">Aquí ves cómo pide un cliente desde la app DulceFriends y qué haces tú en la tableta hasta entregarlo. Sigue la instrucción de arriba y toca el botón que <b>brilla</b> 👆. Si te equivocas no pasa nada: solo es práctica.</p></header>'+
   '<div class="camino" aria-label="Los pasos de siempre"><span>🔔 Suena</span><i>→</i><span>💬 WhatsApp</span><i>→</i><span>✅ Confirmar</span><i>→</i><span>💳 Cobrar</span><i>→</i><span>🎉 Entregar</span></div>'+
   '<div class="barra-prog"><span>'+n+' de '+LECCIONES.length+'</span><div class="pista"><div class="lleno" style="width:'+(n/LECCIONES.length*100)+'%"></div></div></div>'+
   '<div class="lecciones">'+LECCIONES.map(function(x,i){return '<button class="lec" data-lec="'+i+'"><span class="n">'+x.ic+'</span><span><b>'+(i+1)+'. '+x.n+'</b><small>'+x.d+'</small></span>'+(hechos[x.id]?'<span class="chk" aria-label="hecha">✓</span>':'')+'</button>'}).join('')+'</div>';
}
function empezar(i){L=LECCIONES[i];iPaso=0;st=L.ini();cuenta=0;tecleado='';pintar('')}
function pintar(msg,clase){
  var p=L.pasos[iPaso],fin=!!p.fin,total=L.pasos.length-1;
  var h='<div class="instr"><span class="num">'+(fin?'✓':(iPaso+1)+'/'+total)+'</span><p id="txt">'+p.txt+'</p><button class="oir" data-oir="1" aria-label="Escuchar la instrucción">🔊 Escuchar</button></div>';
  h+='<div class="msg '+(clase||'')+'" role="status">'+(msg||'')+'</div>';
  h+=p.p(st);
  var sig=LECCIONES.indexOf(L)+1;
  h+='<div class="controles"><button class="ctl" data-menu="1">← Lecciones</button>'+(fin?(sig<LECCIONES.length?'<button class="ctl prim" data-lec="'+sig+'">Siguiente lección →</button>':'<button class="ctl prim" data-menu="1">¡Terminé todo! 🎉</button>'):'<button class="ctl" data-reiniciar="1">↺ Empezar de nuevo</button>')+'</div>';
  app.innerHTML=h;
  if(fin){hechos[L.id]=1;guardarHechos();return}
  if(p.t){var b=app.querySelector('[data-t="'+p.t+'"]');if(b)b.classList.add('brilla')}
  if(p.teclado){var d=p.teclado.charAt(tecleado.length),k=app.querySelector('[data-t="k-'+d+'"]');if(k)k.classList.add('brilla')}
}
function avanzar(){iPaso++;cuenta=0;tecleado='';pintar('¡Muy bien! 👏','bien')}
app.addEventListener('click',function(ev){
  var x=ev.target.closest('button');if(!x)return;
  if(x.dataset.lec){empezar(+x.dataset.lec);window.scrollTo(0,0);return}
  if(x.dataset.menu){menu();window.scrollTo(0,0);return}
  if(x.dataset.reiniciar){empezar(LECCIONES.indexOf(L));return}
  if(x.dataset.oir){hablar(document.getElementById('txt').textContent);return}
  if(!L)return;
  var p=L.pasos[iPaso],t=x.dataset.t;if(!t||p.fin)return;
  if(p.teclado){
    var esperado=p.teclado.charAt(tecleado.length);
    if(t==='k-'+esperado){tecleado+=esperado;st.num=tecleado;
      if(tecleado===p.teclado){if(p.al)p.al(st);avanzar()}else pintar('¡Eso! Sigue: ahora el '+p.teclado.charAt(tecleado.length)+'.','bien');}
    else{x.classList.add('sacude');var m=document.querySelector('.msg');m.className='msg mal';m.textContent='Casi. Toca el número que brilla 👆'}
    return;
  }
  if(t===p.t){
    if(p.al)p.al(st);cuenta++;
    if(p.veces&&cuenta<p.veces){pintar('¡Bien! Una vez más.','bien');return}
    avanzar();
  }else{
    x.classList.add('sacude');var m=document.querySelector('.msg');m.className='msg mal';m.textContent='Casi. Busca el botón que brilla 👆';
  }
});
menu();
</script>
</body>
</html>
