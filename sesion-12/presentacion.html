nte?", "o": ["Emocional: crea vínculo y sentido de pertenencia", "Monetario: hace que el precio parezca más justo", "De usabilidad: vuelve el producto más práctico", "Relacional: da respaldo mediante reseñas públicas"], "x": "La nota crea vínculo y recuerdo: valor emocional.", "p": null, "ok": null, "rub": null}, {"h": "A", "c": 2, "t": "OM", "q": "Un cliente dice «Es muy caro». Según validar-reencuadrar-responder, ¿qué conviene hacer primero?", "o": ["Reconocer su preocupación y mostrar el valor que recibe", "Ofrecer un descuento enseguida para no perder la venta", "Explicar cuánto te costó producirlo para que lo entienda", "Insistir en que la calidad no se negocia y cerrar el tema"], "x": "No defiendas el precio: justifica el valor. Bajar el precio en el primer minuto es el error.", "p": null, "ok": null, "rub": null}, {"h": "A", "c": 2, "t": "COMP", "q": "En la fórmula «[Característica], lo que significa que ______», se completa con el beneficio para el cliente.", "o": ["beneficio", "lo que el cliente gana"], "x": "Característica = lo que tiene; beneficio = lo que el cliente gana.", "p": null, "ok": null, "rub": null}, {"h": "A", "c": 2, "t": "RETO", "q": "RETO $: Reescriban con la fórmula «[Característica], lo que significa que [beneficio]» esta característica: «{CAR}».", "o": null, "x": "", "p": "reto_car", "ok": null, "rub": "Usa la fórmula y el beneficio responde a «¿y eso a mí de qué me sirve?»."}, {"h": "A", "c": 3, "t": "VF", "q": "Un prospecto y un lead son lo mismo.", "o": null, "x": "Falso. Un lead ya respondió, mostró interés y puede pagar o decidir; un prospecto solo podría necesitarte.", "p": null, "ok": false, "rub": null}, {"h": "A", "c": 3, "t": "OM", "q": "¿Cuál es el orden correcto de las cuatro preguntas SPIN?", "o": ["Situación, Problema, Implicación, Necesidad de solución", "Problema, Situación, Necesidad de solución, Implicación", "Situación, Implicación, Problema, Necesidad de solución", "Necesidad de solución, Problema, Situación, Implicación"], "x": "SPIN va siempre en orden y ninguna pregunta menciona el producto.", "p": null, "ok": null, "rub": null}, {"h": "A", "c": 3, "t": "OM", "q": "Un cliente institucional pide cotización formal y debe consultarlo con su comité. ¿Qué enfoque conviene?", "o": ["Consultiva para diagnosticar y propuesta escrita al comité", "AIDA con un mensaje corto por redes sociales", "Cierre directo en la primera llamada con descuento", "SPIN únicamente por un mensaje de WhatsApp"], "x": "Cliente institucional con varios decisores: consultiva + propuesta escrita.", "p": null, "ok": null, "rub": null}, {"h": "A", "c": 3, "t": "COMP", "q": "En SPIN, la pregunta que amplifica las consecuencias de no resolver el problema es la de ______.", "o": ["implicación"], "x": "Implicación: «¿Cómo afecta eso a sus tiempos de entrega o ventas?».", "p": null, "ok": null, "rub": null}, {"h": "A", "c": 3, "t": "COMP", "q": "La conversión por etapa se calcula así: etapa siguiente ÷ etapa ______ × 100.", "o": ["anterior"], "x": "Conversión por etapa = etapa siguiente ÷ etapa anterior × 100.", "p": null, "ok": null, "rub": null}, {"h": "A", "c": 3, "t": "RETO", "q": "RETO $: Redacten UNA pregunta de Implicación (SPIN) para un cliente que {CL}. No pueden mencionar su producto.", "o": null, "x": "", "p": "reto_spin", "ok": null, "rub": "Pregunta que amplifica consecuencias del problema, sin mencionar el producto."}, {"h": "A", "c": 4, "t": "VF", "q": "Si un negocio no vende, la solución siempre es conseguir más seguidores.", "o": null, "x": "Mito. Primero ubica en qué etapa del embudo se cae: puede ser mensaje, precio o atención.", "p": null, "ok": false, "rub": null}, {"h": "A", "c": 4, "t": "OM", "q": "Un negocio vende cargadores estándar y quiere tráfico y logística listos desde el primer día. ¿Qué canal conviene para arrancar?", "o": ["Marketplace, aunque cobre una comisión por venta", "E-commerce propio, donde él atrae todo el tráfico", "Redes con venta directa, apoyadas solo en la imagen", "WhatsApp Business, con venta uno a uno sin inversión"], "x": "Producto físico estandarizado: marketplace (tráfico y logística listos; pagas comisión).", "p": null, "ok": null, "rub": null}, {"h": "A", "c": 4, "t": "OM", "q": "En una semana, {V} personas ven una publicación y {S} compran. ¿Cuál es la tasa de conversión? (ventas ÷ visitas) × 100", "o": null, "x": "Conversión = ventas ÷ visitas × 100. Distractores: ventas ÷ mensajes, ventas/visitas sin ×100.", "p": "conversion", "ok": null, "rub": null}, {"h": "A", "c": 4, "t": "COMP", "q": "Las etapas del embudo digital son alcance, interés, conversión y ______.", "o": ["recompra"], "x": "Alcance → Interés → Conversión → Recompra.", "p": null, "ok": null, "rub": null}, {"h": "A", "c": 4, "t": "RETO", "q": "RETO $: Un negocio {NEG}. Elijan UN canal (marketplace, e-commerce propio, redes o WhatsApp) y justifíquenlo con UNO de los 4 criterios de elección.", "o": null, "x": "", "p": "reto_canal", "ok": null, "rub": "Canal coherente + criterio (cliente, producto, recursos o ticket y margen)."}, {"h": "A", "c": 5, "t": "VF", "q": "Un colaborador M4 (alta capacidad y alta disposición) necesita instrucciones paso a paso y supervisión cercana.", "o": null, "x": "Falso. M4 pide autonomía (delegar) y seguimiento a resultados.", "p": null, "ok": false, "rub": null}, {"h": "A", "c": 5, "t": "OM", "q": "Una integrante nueva no sabe hacer la tarea, pero está muy motivada (M2). ¿Qué estilo conviene?", "o": ["Persuadir: explicar el porqué, dirigir y motivar", "Delegar: darle autonomía y revisar solo resultados", "Participar: decidir junto con ella cada paso", "Dirigir con instrucciones y supervisión, sin motivar"], "x": "M2 = baja capacidad, alta disposición → S2 persuadir (tarea alta, relación alta).", "p": null, "ok": null, "rub": null}, {"h": "A", "c": 5, "t": "OM", "q": "El modelo SBI para dar feedback consiste en describir…", "o": ["Situación, Comportamiento e Impacto", "Sentimiento, Beneficio e Intención", "Solución, Brecha e Indicador", "Situación, Beneficio e Instrucción"], "x": "SBI: Situación + Comportamiento + Impacto.", "p": null, "ok": null, "rub": null}, {"h": "A", "c": 5, "t": "COMP", "q": "El estilo de comunicación que evita el conflicto a cualquier costo se llama ______.", "o": ["pasivo"], "x": "Pasivo evita el conflicto; agresivo impone; asertivo construye equipos.", "p": null, "ok": null, "rub": null}, {"h": "A", "c": 5, "t": "RETO", "q": "RETO $: Redacten un feedback SBI (una frase por letra) para este caso: «{SBI}».", "o": null, "x": "", "p": "reto_sbi", "ok": null, "rub": "S concreta, B observable (sin juicios) e I con efecto real en el equipo."}, {"h": "A", "c": 6, "t": "VF", "q": "El Buyer Persona se construye únicamente con datos demográficos.", "o": null, "x": "Falso. Tiene tres capas: demografía, psicografía y conducta.", "p": null, "ok": false, "rub": null}, {"h": "A", "c": 6, "t": "OM", "q": "En el Value Proposition Canvas, ¿qué pertenece al perfil del cliente?", "o": ["Jobs, pains y gains", "Pain relievers y gain creators", "Productos y servicios de la empresa", "Canales de venta y fuentes de ingreso"], "x": "Perfil del cliente: jobs, pains, gains. Mapa de valor: productos, pain relievers, gain creators.", "p": null, "ok": null, "rub": null}, {"h": "A", "c": 6, "t": "OM", "q": "¿Cómo conviene cerrar un pitch comercial basado en storytelling de venta?", "o": ["Con un llamado a la acción concreto", "Con un agradecimiento y preguntas abiertas", "Con un resumen de los costos de producción", "Con una disculpa por el tiempo utilizado"], "x": "El storytelling captura, engancha y cierra con llamado a la acción concreto.", "p": null, "ok": null, "rub": null}, {"h": "A", "c": 6, "t": "COMP", "q": "En el Value Proposition Canvas, el perfil del cliente describe sus tareas (jobs), sus dolores (pains) y sus ______ (gains).", "o": ["ganancias", "beneficios esperados"], "x": "Gains = ganancias o beneficios que el cliente espera.", "p": null, "ok": null, "rub": null}, {"h": "A", "c": 6, "t": "RETO", "q": "RETO $: Escriban en UNA frase la propuesta de valor de un proyecto de «{PROY}»: para quién, qué problema resuelve y qué gana el cliente.", "o": null, "x": "", "p": "reto_valor", "ok": null, "rub": "Incluye cliente, problema y beneficio; sin generalidades."}, {"h": "A", "c": 1, "t": "VF", "q": "El costo unitario sirve para saber en cuánto mínimo debes vender y tomar decisiones de precio.", "o": null, "x": "Verdadero: permite calcular ganancia, rentabilidad y decisiones de pricing.", "p": null, "ok": true, "rub": null}, {"h": "A", "c": 3, "t": "COMP", "q": "En la venta consultiva, el vendedor primero ______ las necesidades del cliente y solo después propone.", "o": ["diagnostica", "pregunta", "entiende"], "x": "Consultiva: pregunta primero, recomienda después.", "p": null, "ok": null, "rub": null}, {"h": "A", "c": 0, "t": "FINAL", "q": "una cafetería de especialidad", "o": null, "x": "Reto por equipos", "p": null, "ok": null, "rub": null}, {"h": "A", "c": 0, "t": "FINAL", "q": "una marca de playeras yucatecas", "o": null, "x": "Reto por equipos", "p": null, "ok": null, "rub": null}, {"h": "A", "c": 0, "t": "FINAL", "q": "un servicio de mudanzas para estudiantes", "o": null, "x": "Reto por equipos", "p": null, "ok": null, "rub": null}, {"h": "A", "c": 0, "t": "FINAL", "q": "una app de tutorías para preparatoria", "o": null, "x": "Reto por equipos", "p": null, "ok": null, "rub": null}, {"h": "B", "c": 1, "t": "VF", "q": "Si un despacho jurídico atiende menos clientes un mes, el alquiler de su oficina baja en proporción.", "o": null, "x": "Falso. El alquiler es un costo fijo.", "p": null, "ok": false, "rub": null}, {"h": "B", "c": 1, "t": "OM", "q": "Una editorial de cuadernos tiene un costo unitario de ${CU} y quiere un margen de {M} % sobre el precio. Con Precio = CU ÷ (1 − % margen), ¿qué precio debe cobrar?", "o": null, "x": "Margen sobre el precio, no sobre el costo.", "p": "precio_margen", "ok": null, "rub": null}, {"h": "B", "c": 1, "t": "OM", "q": "¿Cuál de estos costos es fijo en una consultoría de comercio exterior?", "o": ["El sueldo mensual de las analistas contratadas", "Los envíos de documentos que se hacen por cliente", "Las comisiones pagadas por cada contrato cerrado", "El papel y la impresión usados en cada informe"], "x": "Fijo = se paga igual venda mucho o poco (sueldos mensuales).", "p": null, "ok": null, "rub": null}, {"h": "B", "c": 1, "t": "COMP", "q": "El margen de contribución se calcula restando al precio el costo ______ unitario.", "o": ["variable"], "x": "MC = P − CVu.", "p": null, "ok": null, "rub": null}, {"h": "B", "c": 1, "t": "RETO", "q": "RETO $: Un negocio vende a ${P}, con costo variable de ${CV} por unidad y costos fijos de ${CF} al mes. Escriban su punto de equilibrio y UNA acción si no lo alcanzan.", "o": null, "x": "", "p": "reto_pe", "ok": null, "rub": "Cálculo correcto PE = CF ÷ (P − CV) + una acción coherente."}, {"h": "B", "c": 2, "t": "VF", "q": "Las reseñas de cinco estrellas generan principalmente valor de usabilidad.", "o": null, "x": "Falso. Generan valor relacional: confianza, seguridad y respaldo.", "p": null, "ok": false, "rub": null}, {"h": "B", "c": 2, "t": "OM", "q": "Una tienda ofrece entrega a domicilio sin costo. ¿Qué tipo de valor genera principalmente?", "o": ["De usabilidad: solución práctica y conveniente", "Emocional: vínculo, recuerdo o pertenencia", "Monetario: el precio se percibe justo u oportuno", "Relacional: confianza por respaldo de terceros"], "x": "Entrega a domicilio = conveniencia: valor de usabilidad.", "p": null, "ok": null, "rub": null}, {"h": "B", "c": 2, "t": "OM", "q": "Una empresa tiene una falla y aún no tiene la solución completa. Según el protocolo de crisis, ¿qué debe hacer?", "o": ["Comunicar qué ocurre y dar un tiempo estimado", "Esperar a tener la solución completa para avisar", "Evitar el tema hasta que los clientes pregunten", "Culpar al proveedor para proteger la reputación"], "x": "El silencio se interpreta como negligencia; comunica aunque no tengas la solución.", "p": null, "ok": null, "rub": null}, {"h": "B", "c": 2, "t": "COMP", "q": "El ______ al cliente es el acompañamiento constante antes, durante y después de la compra; el servicio resuelve un problema concreto.", "o": ["atención"], "x": "Atención = cómo lo hacemos; servicio = qué hacemos.", "p": null, "ok": null, "rub": null}, {"h": "B", "c": 2, "t": "RETO", "q": "RETO $: Un cliente dice «{OBJ}». Escriban una respuesta de 2 frases aplicando validar-reencuadrar-responder.", "o": null, "x": "", "p": "reto_obj", "ok": null, "rub": "Valida la preocupación, reencuadra y responde sin atacar ni regalar precio."}, {"h": "B", "c": 3, "t": "VF", "q": "La etapa de seguimiento suele ser la más subestimada del proceso de venta.", "o": null, "x": "Verdadero: muchos leads nunca reciben un segundo contacto.", "p": null, "ok": true, "rub": null}, {"h": "B", "c": 3, "t": "OM", "q": "¿Cuál de estas preguntas es de tipo Problema en SPIN?", "o": ["«¿Qué dificultades han tenido para hacerlo así?»", "«¿Cómo manejan hoy este proceso en su oficina?»", "«¿Cómo afecta eso a sus tiempos de entrega?»", "«¿Qué significaría para el equipo resolverlo?»"], "x": "Problema explora dificultades y puntos de dolor.", "p": null, "ok": null, "rub": null}, {"h": "B", "c": 3, "t": "OM", "q": "Un cliente emocional y rápido decide por impulso al ver una imagen. ¿Qué combinación conviene?", "o": ["AIDA con un mensaje corto por redes sociales", "Consultiva con propuesta escrita para su comité", "SPIN en una reunión formal de varias sesiones", "Cotización formal enviada por correo con adjunto"], "x": "Consumidor final de decisión rápida: AIDA + redes.", "p": null, "ok": null, "rub": null}, {"h": "B", "c": 3, "t": "COMP", "q": "AIDA significa atención, interés, deseo y ______.", "o": ["acción"], "x": "AIDA estructura un mensaje; SPIN estructura una conversación.", "p": null, "ok": null, "rub": null}, {"h": "B", "c": 3, "t": "COMP", "q": "Cerrar la venta consiste en ______ la venta de forma explícita.", "o": ["pedir"], "x": "Ninguna técnica de cierre consiste en esperar a que el cliente la pida.", "p": null, "ok": null, "rub": null}, {"h": "B", "c": 3, "t": "RETO", "q": "RETO $: Escriban un cierre «por alternativa» para ofrecer {OFR} a un cliente que ya mostró señales de estar listo.", "o": null, "x": "", "p": "reto_cierre", "ok": null, "rub": "Ofrece dos opciones concretas y ambas implican comprar."}, {"h": "B", "c": 4, "t": "VF", "q": "En el embudo digital, la conversión mide cuántas personas que llegan terminan comprando.", "o": null, "x": "Conversión = ventas ÷ visitas × 100.", "p": null, "ok": true, "rub": null}, {"h": "B", "c": 4, "t": "OM", "q": "Un servicio a la medida, de ticket alto y vendido por una sola persona. ¿Qué canal encaja mejor?", "o": ["WhatsApp Business, con venta uno a uno", "Marketplace con comisión por venta", "E-commerce propio con catálogo estándar", "Redes con venta directa y pauta pagada"], "x": "Servicio a la medida, ticket alto y una persona: canal conversacional.", "p": null, "ok": null, "rub": null}, {"h": "B", "c": 4, "t": "OM", "q": "Se obtuvieron ${ING} de ingresos con {S} ventas. ¿Cuál es el ticket promedio? (ingresos ÷ ventas)", "o": null, "x": "Ticket promedio = ingresos ÷ número de ventas.", "p": "ticket", "ok": null, "rub": null}, {"h": "B", "c": 4, "t": "COMP", "q": "Un producto de ticket bajo con comisión alta puede quedar sin utilidad: el criterio que lo descarta es ______ y margen.", "o": ["ticket"], "x": "Ticket y margen: $20 de margen − $20 de comisión = $0.", "p": null, "ok": null, "rub": null}, {"h": "B", "c": 4, "t": "RETO", "q": "RETO $: Un negocio {NEG}. Elijan UN canal y justifíquenlo con UNO de los 4 criterios de elección.", "o": null, "x": "", "p": "reto_canal", "ok": null, "rub": "Canal coherente + criterio claro."}, {"h": "B", "c": 5, "t": "VF", "q": "En el liderazgo situacional, un colaborador M1 pide un estilo de delegar.", "o": null, "x": "Falso. M1 (baja capacidad, baja disposición) pide dirigir.", "p": null, "ok": false, "rub": null}, {"h": "B", "c": 5, "t": "OM", "q": "Un colaborador sabe hacer la tarea pero duda y se desmotiva (M3). ¿Qué estilo conviene?", "o": ["Participar: apoyarlo y decidir junto con él", "Dirigir: dar instrucciones y supervisión cercana", "Persuadir: explicar el porqué de cada paso", "Delegar: darle autonomía y no intervenir"], "x": "M3 = alta capacidad, baja disposición → S3 participar.", "p": null, "ok": null, "rub": null}, {"h": "B", "c": 5, "t": "OM", "q": "Según el liderazgo situacional, la pregunta clave para diagnosticar es:", "o": ["¿Lo hizo mal por no saber o por no querer?", "¿Cuánto tiempo lleva en el equipo?", "¿Quién tiene más experiencia que los demás?", "¿Qué estilo prefiere usar el líder?"], "x": "Madurez = capacidad + disposición.", "p": null, "ok": null, "rub": null}, {"h": "B", "c": 5, "t": "COMP", "q": "El estilo de comunicación que impone sin escuchar ni respetar se llama ______.", "o": ["agresivo"], "x": "Pasivo evita; agresivo impone; asertivo equilibra.", "p": null, "ok": null, "rub": null}, {"h": "B", "c": 5, "t": "RETO", "q": "RETO $: Redacten un feedback SBI (una frase por letra) para este caso: «{SBI}».", "o": null, "x": "", "p": "reto_sbi", "ok": null, "rub": "S concreta, B observable e I con efecto real."}, {"h": "B", "c": 6, "t": "VF", "q": "El Value Proposition Canvas incluye un mapa de valor con productos, pain relievers y gain creators.", "o": null, "x": "Verdadero: es la parte de la propuesta frente al perfil del cliente.", "p": null, "ok": true, "rub": null}, {"h": "B", "c": 6, "t": "OM", "q": "¿Qué tres capas componen un Buyer Persona?", "o": ["Demografía, psicografía y conducta", "Producto, precio y promoción", "Jobs, pains y gains", "Alcance, interés y conversión"], "x": "Las tres capas del Buyer Persona.", "p": null, "ok": null, "rub": null}, {"h": "B", "c": 6, "t": "OM", "q": "En el pitch comercial, ¿qué ayuda a que el panel sienta el problema como real?", "o": ["Pr var CT=null;
function crc32(b){if(!CT){CT=[];for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;CT[n]=c>>>0;}}var c2=0xFFFFFFFF;for(var i=0;i<b.length;i++)c2=CT[(c2^b[i])&255]^(c2>>>8);return (c2^0xFFFFFFFF)>>>0;}
function zipStore(files){
  var enc=new TextEncoder(),loc=[],cen=[],off=0;
  files.forEach(function(f){
    var nm=enc.encode(f.n),d=typeof f.d==='string'?enc.encode(f.d):f.d,crc=crc32(d);
    var lh=new Uint8Array(30+nm.length),v=new DataView(lh.buffer);
    v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x0800,true);v.setUint16(8,0,true);v.setUint16(10,0,true);v.setUint16(12,0x21,true);v.setUint32(14,crc,true);v.setUint32(18,d.length,true);v.setUint32(22,d.length,true);v.setUint16(26,nm.length,true);v.setUint16(28,0,true);lh.set(nm,30);
    var ch=new Uint8Array(46+nm.length),w=new DataView(ch.buffer);
    w.setUint32(0,0x02014b50,true);w.setUint16(4,20,true);w.setUint16(6,20,true);w.setUint16(8,0x0800,true);w.setUint16(10,0,true);w.setUint16(12,0,true);w.setUint16(14,0x21,true);w.setUint32(16,crc,true);w.setUint32(20,d.length,true);w.setUint32(24,d.length,true);w.setUint16(28,nm.length,true);w.setUint32(42,off,true);ch.set(nm,46);
    loc.push(lh,d);cen.push(ch);off+=lh.length+d.length;
  });
  var cs=cen.reduce(function(a,b){return a+b.length;},0),eo=new Uint8Array(22),e=new DataView(eo.buffer);
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob(loc.concat(cen,[eo]),{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function colL(i){var s='';i++;while(i>0){var m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;}
function xe(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'');}
function sheetXml(rows){
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'
   +rows.map(function(r,ri){return '<row r="'+(ri+1)+'">'+r.map(function(v,ci){var ref=colL(ci)+(ri+1);if(typeof v==='number'&&isFinite(v))return '<c r="'+ref+'"><v>'+v+'</v></c>';return '<c r="'+ref+'" t="inlineStr"><is><t>'+xe(v==null?'':v)+'</t></is></c>';}).join('')+'</row>';}).join('')+'</sheetData></worksheet>';

  Object.keys(G.people).map(function(d){return G.people[d];}).sort(function(a,b){return (a.tm||99)-(b.tm||99)||a.nm.localeCompare(b.nm);}).forEach(function(p){
    var a=agg[p.dev]||{n:0,ok:0,amt:0},t=team(p.tm),tk=G.tickets[p.dev];
    per.push([p.nm,p.ap,t?t.n:'(sin equipo)',a.n,a.ok,a.amt,G.launched?Math.min(100,Math.round(a.n/G.launched*100)):0,tk?COLN[tk-1]:'']);
  });
  var rk=G.teams.slice().sort(function(a,b){return (G.scr[b.id]||0)-(G.scr[a.id]||0);});
  var eq=[['Equipo','Integrantes','$ finales','Posición']];
  rk.forEach(function(t,i){eq.push([t.n,members(t.id).length,G.scr[t.id]||0,i+1]);});
  var det=[['Pregunta','Columna','Tipo','Nombre','Apellido','Equipo','Respuesta','Correcta (1/0)','$ aportados']];
  G.detail.forEach(function(r){det.push([r.q,r.col,r.ty,r.nm,r.ap,r.tm,r.resp,r.ok,r.amt||0]);});
  det.push([]);det.push(['Semilla de preguntas',G.seed,'NRC',GRP]);
  var names=['Por persona','Por equipo','Detalle'],sh=[per,eq,det];
  var files=[
   {n:'[Content_Types].xml',d:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+sh.map(function(_,i){return '<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';}).join('')+'</Types>'},
   {n:'_rels/.rels',d:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
   {n:'xl/workbook.xml',d:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+names.map(function(n,i){return '<sheet name="'+n+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>';}).join('')+'</sheets></workbook>'},
   {n:'xl/_rels/workbook.xml.rels',d:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+names.map(function(_,i){return '<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>';}).join('')+'</Relationships>'}
  ];
  sh.forEach(function(s,i){files.push({n:'xl/worksheets/sheet'+(i+1)+'.xml',d:sheetXml(s)});});
  var blob=zipStore(files),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Sesion12_Jeopardy_NRC'+GRP+'.xlsx';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},800);
  toast('📥 Excel descargado');
}

/* ---------- eventos ---------- */
function goto(i){G.slide=i;if(i===3)setTimeout(confetti,300);sync();}
document.addEventListener('click',function(e){
  var g=e.target.closest('[data-g]');if(g){if(g.dataset.g!==GRP){lsSet('s12g',g.dataset.g);location.search='?g='+g.dataset.g;}return;}
  var el=e.target.closest('[data-a]');
  var m=$('#menu');if(!e.target.closest('#bMenu')&&!e.target.closest('#menu'))m.style.display='none';
  if(!el)return;
  var a=el.dataset.a;
  if(a==='mv'||a==='rm')return;
  if(a==='next'){goto(Math.min(3,G.slide+1));return;}
  if(a==='addteam'){if(G.teams.length>=11){toast('Máximo 11 equipos');return;}var used=G.teams.map(function(t){return t.id;}),id=1;while(used.indexOf(id)>-1)id++;G.teams.push({id:id,n:'Equipo '+id,c:TCOL[id-1]});G.order.push(id);G.order=G.order.filter(function(v,i,s){return s.indexOf(v)===i;});sync();return;}
  if(a==='ren'){var t=team(+el.dataset.t),n=prompt('Nombre del equipo',t.n);if(n&&n.trim()){t.n=n.trim().slice(0,22);sync();}return;}
  if(a==='del'){var t2=team(+el.dataset.t);if(G.teams.length<=2){toast('Mínimo 2 equipos');return;}if(confirm('¿Eliminar '+t2.n+'? Sus integrantes quedarán sin equipo.')){G.teams=G.teams.filter(function(x){return x.id!==t2.id;});for(var d in G.people)if(G.people[d].tm===t2.id)G.people[d].tm=null;sync();}return;}
  if(a==='auto'){var un=unassigned();shuf(un,Math.random).forEach(function(p){var best=G.teams.slice().sort(function(x,y){return members(x.id).length-members(y.id).length;})[0];p.tm=best.id;});sync();return;}
  if(a==='pick'){if(G.slide!==2||G.cur)return;openCell(+el.dataset.i);return;}
  if(a==='drawer'){drawer=!drawer;renderDr();return;}
  if(a==='reveal'){revealChoice();return;}
  if(a==='close'){finishQ();return;}
  if(a==='swap'){swapQ();return;}
  if(a==='bet'){var c=G.cur;if(c&&c.ph==='bet'){c.bet=+el.dataset.v;c.ph='open';c.dur=c.k==='VF'?25:35;c.te=Date.now()+c.dur*1000;sync();}return;}
  if(a==='ok'){judge(true);return;}
  if(a==='no'){judge(false);return;}
  if(a==='shown'){var cc=G.cur;if(cc){cc.res=[];cc.ph='rev';G.launched++;sync();}return;}
  if(a==='tovote'){toVote();return;}
  if(a==='revvote'){revealVote();return;}
  if(a==='final'){if(G.played<8&&!confirm('Aún no se juegan 8 fichas. ¿Iniciar el reto final de todos modos?'))return;openFinal();return;}
  if(a==='closefin'){closeFinal();return;}
  if(a==='xls'){exportXlsx();return;}
  if(a==='conf'){confetti();return;}
});
